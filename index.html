      {id:'AM-2403',client:'costa',category:'banking',title:'Нужно банковское подтверждение оплаты',message:'Добрый день! Для бухгалтерии поставщика нужно подтверждение платежа на 3 420 € в пользу Arco Supplies. В документе должны быть дата исполнения и банковский референс. Где его можно получить?',channel:'Email',created:'2026-09-24T10:55:00+02:00',due:'2026-09-24T13:00:00+02:00',priority:'normal',owner:'elena',status:'new',next:'Подготовить подтверждение с референсом банка',paymentIds:['P-7710'],steps:['Найти операцию и проверить сумму и получателя.','Убедиться, что банк подтвердил исполнение; сверить банковский reference.','Открыть банковское подтверждение и подготовить ответ с документом.'],reply:'Мария, банк подтвердил исполнение перевода на 3 420 € сегодня, 24 сентября, в 10:05. Банковский референс — BANK-DEMO-7710. Подготовлю подтверждение исполнения с суммой, датой и получателем Arco Supplies SL для вашей бухгалтерии.',success:'Банковское подтверждение доступно из обращения; оно явно отличается от первоначального поручения клиента.',routes:['/payments','/transactions','/integrations/equals']},
      {id:'AM-2404',client:'nord',category:'banking',title:'Перевод вернулся, денег на балансе нет',message:'Банк получателя отклонил 1 940 € из-за ошибки в реквизитах. Вы написали, что идёт возврат, но на нашем балансе его нет. Деньги уже вернулись или только возвращаются? Нужно ли отправить платёж заново?',channel:'Email',created:'2026-09-24T11:00:00+02:00',due:'2026-09-24T13:00:00+02:00',priority:'normal',owner:'mark',status:'bank',queue:'payments',next:'Отследить зачисление возврата',paymentIds:['P-5540'],steps:['Проверить причину возврата по исходному платежу.','Отдельно проверить факт зачисления возврата на счёт.','Сообщить текущую стадию и уточнить исправленные реквизиты для будущего платежа.'],reply:'Алексей, по RET-DEMO-5540 банк сообщил о возврате из-за реквизитов. На 11:15 возврат ещё не зачислен на ваш счёт. Это стадия возврата, а не завершённое зачисление. Буду отслеживать поступление; перед новым платежом нужно сверить исправленные реквизиты получателя.',success:'«Возврат начат» и «возврат зачислен» не смешиваются; обращение остаётся на контроле до результата.',routes:['/payments','/accounts','/recipients']},
      {id:'AM-2405',client:'lumen',category:'banking',title:'Два списания по одному инвойсу?',message:'У меня два раза отображается 980 € в пользу Verde Office по одному счёту INV-DEMO-610. После первой попытки страница зависла, я нажал ещё раз. Вы оплатили поставщику дважды? Помогите разобраться.',channel:'Чат',created:'2026-09-24T11:05:00+02:00',due:'2026-09-24T12:05:00+02:00',priority:'high',owner:'anna',status:'new',next:'Сравнить два ID: исполненный перевод и резерв',paymentIds:['P-6101','P-6102'],steps:['Открыть обе операции с одинаковым инвойсом и разными ID.','Разделить исполненный платёж P-6101 и резерв P-6102 с неизвестным результатом.','Передать проверку второй операции в платёжные операции, приложив оба ID.'],reply:'Денис, нашла две записи по INV-DEMO-610. Первая, P-6101, исполнена банком. По второй, P-6102, вижу резерв 980 €, но окончательный ответ банка ещё неизвестен. Пока это не подтверждает двойную оплату. Передам оба ID на проверку и сообщу результат сегодня до 12:05.',success:'Обе операции видны рядом, резерв не назван списанием, результат второй операции не придуман.',routes:['/payments','/transactions','/payment-logs']},
      {id:'AM-2406',client:'sofia',category:'cards',title:'Потеряна карта · нужно приостановить',message:'Я только что потеряла кошелёк в метро. Срочно заблокируйте, пожалуйста, физическую карту с окончанием 4912! Телефон со мной, в приложение могу зайти. Виртуальную карту не трогайте.',channel:'Чат',created:'2026-09-24T11:20:00+02:00',due:'2026-09-24T11:25:00+02:00',priority:'urgent',owner:'anna',status:'new',next:'Приостановить именно физическую карту •• 4912',cardId:'CARD-4912',steps:['Сопоставить клиента и последние четыре цифры нужной карты.','Приостановить выбранную карту и проверить подтверждённый результат.','Сообщить клиенту статус именно этой карты и следующий шаг по замене.'],reply:'София, вижу запрос по физической карте •• 4912. Проверяю её статус и возможность приостановки. Виртуальная карта •• 8806 — отдельная карта. Подтвержу результат приостановки сразу после ответа провайдера.',success:'Срочное обращение первое в очереди; доступно контекстное действие для нужной карты и виден его результат.',routes:['/cards','/clients']},
      {id:'AM-2407',client:'sofia',category:'cards',title:'Онлайн-покупка отклонена при достаточном балансе',message:'Почему не проходит покупка на 129 € по виртуальной карте 8806? На счёте есть деньги. Магазин пишет просто «отклонено». Это блокировка или какой-то лимит?',channel:'Чат',created:'2026-09-24T11:10:00+02:00',due:'2026-09-24T12:40:00+02:00',priority:'normal',owner:'anna',status:'new',next:'Объяснить причину отказа и действующий лимит',cardId:'CARD-8806',steps:['Сопоставить отклонённую покупку, сумму и нужную карту.','Проверить статус карты, доступный остаток и причину отказа провайдера.','Объяснить лимит и доступный клиенту путь его изменения.'],reply:'София, карта •• 8806 активна, доступного остатка достаточно. По этой попытке причина отказа — лимит одной онлайн-покупки: в текущих настройках он составляет 100 €, а покупка — 129 €. Уточню доступный для вашей карты порядок изменения лимита.',success:'Менеджер видит объяснение причины отказа, а не только технический код; лимит и баланс находятся рядом.',routes:['/cards','/accounts']},
      {id:'AM-2408',client:'maya',category:'cards',title:'После заказа карта не появилась',message:'Заказала виртуальную карту час назад. Комиссия списалась, потом появилась ошибка, а самой карты в приложении нет. Мне попробовать заказать её ещё раз? Карта нужна сегодня.',channel:'Email',created:'2026-09-24T10:45:00+02:00',due:'2026-09-24T12:15:00+02:00',priority:'high',owner:'anna',status:'specialist',queue:'cards',next:'Проверить результат выпуска у провайдера',cardId:'CARD-PENDING',steps:['Проверить существующую заявку: результат неизвестен, локального SAN нет.','Передать карточным операциям ID заявки для проверки в кабинете провайдера.','После проверки привязать существующий результат выпуска через предусмотренный процесс и проверить видимость карты.'],reply:'Майя, существующая заявка на выпуск пока ожидает уточнения результата у провайдера. Ошибка после заказа сама по себе не означает, что карта не создана. Карточные операции проверяют текущую заявку; повторный заказ для этой проверки не нужен. Следующее обновление от меня — до 12:15.',success:'Неопределённый результат выпуска отображается отдельным состоянием и ведёт к проверке существующей заявки.',routes:['/cards','/cards/manual']},

    const seeded=seed=>{let s=seed>>>0||1;return()=>(s=Math.imul(s,1664525)+1013904223>>>0)/4294967296};

    function clientTransfers(c){const real=PAYMENTS.filter(p=>p.client===c.id).map(p=>({id:p.id,paymentId:p.id,direction:p.direction,counterparty:p.counterparty,amount:p.amount,status:p.bankStatus,attention:p.attention,at:p.updated,reference:p.reference}));if(c.kyc!=='Проверен')return real;const rnd=seeded(Number(c.code)*7919+13);const n=3+Math.floor(rnd()*5);const start=Date.parse(c.created+'T12:00:00'),end=Date.parse('2026-09-23T18:00:00+02:00');const gen=[];for(let k=0;k<n;k++){const r=rnd();const at=new Date(start+rnd()*Math.max(end-start,864e5));const party=TRANSFER_PARTIES[Math.floor(rnd()*TRANSFER_PARTIES.length)];gen.push({id:`TR-${c.code}-${k+1}`,direction:rnd()<.65?'out':'in',counterparty:party,amount:Math.round((40+rnd()*(c.type==='Компания'?9000:1400))/10)*10,status:r<.82?'Исполнен':r<.93?'В обработке':'Отклонён',attention:r>=.82,at:at.toISOString(),reference:`TRF-DEMO-${c.code}${String(k+1).padStart(2,'0')}`,iban:(IBAN_PREFIX[c.country]||'EU')+'** **** '+String(1000+Math.floor(rnd()*9000))})}return [...real,...gen].sort((a,b)=>Date.parse(b.at)-Date.parse(a.at))}
    function clientCards(c){const real=state.cards.filter(k=>k.client===c.id).map(k=>({last4:k.last4,type:k.type,status:k.status,caseId:k.caseId,expiry:'09/28',ok:k.code==='ACTIVE'&&!k.attention}));let cards=real;if(c.kyc==='Проверен'&&!real.length){const rnd=seeded(Number(c.code)*104729+7);const n=1+Math.floor(rnd()*2);cards=[];for(let k=0;k<n;k++){const blocked=rnd()<.15;cards.push({last4:String(1000+Math.floor(rnd()*9000)),type:k===0?(c.type==='Компания'?'Корпоративная':'Физическая'):'Виртуальная',status:blocked?'Заблокирована':'Активна',ok:!blocked,expiry:`${String(1+Math.floor(rnd()*12)).padStart(2,'0')}/${27+Math.floor(rnd()*3)}`})}}const issued=cards.filter(k=>k.last4);const rnd=seeded(Number(c.code)*17+3);const weights=issued.map(()=>0.35+rnd());const total=weights.reduce((a,b)=>a+b,0)||1;let left=Math.round(c.available*100)/100;issued.forEach((k,i)=>{k.balance=i===issued.length-1?Math.round(left*100)/100:Math.round(c.available*weights[i]/total*100)/100;left=Math.round((left-k.balance)*100)/100});cards.forEach(k=>{if(!k.last4)k.balance=null});return cards}

    function pauseCard(id){const card=getCard(id);if(!card||card.code!=='ACTIVE')return;card.code='SUSPENDED';card.status='Приостановлена';card.updated='2026-09-24T11:30:00+02:00';card.detail='Физическая карта приостановлена в демо после сообщения об утрате. Виртуальная карта •• 8806 остаётся отдельной активной картой.';card.attention=false;const c=getCase(card.caseId);c.status='progress';c.next='Сообщить результат приостановки и порядок замены';state.checks[c.id]=[true,true,false];state.replies[c.id]={text:'София, физическая карта •• 4912 приостановлена. Виртуальная карта •• 8806 остаётся активной. Следующим шагом уточню порядок замены физической карты.',saved:false,generated:true};log(c.id,'Демо: получен результат приостановки карты •• '+card.last4+'.');render();updateCasePanel();toast('В макете карта •• '+card.last4+' приостановлена.')}
    document.addEventListener('click',async e=>{const close=e.target.closest('[data-close]');if(close){$(close.dataset.close).close();return}const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}const filter=e.target.closest('[data-filter]');if(filter){const map={case:'caseFilter',payment:'paymentFilter',card:'cardFilter',scenario:'scenarioFilter',client:'clientScope'};ui[map[filter.dataset.filter]]=filter.dataset.value;render();return}const btn=e.target.closest('[data-action]');if(!btn)return;const {action,id}=btn.dataset;if(action==='case'){if($('secondary').open)$('secondary').close();openCase(id)}else if(action==='client')openClient(id);else if(action==='payment')openPayment(id);else if(action==='document')openDocument(id);else if(action==='new')openCompose();else if(action==='owner'){ui.scope=id;ui.caseFilter='open';setView('work')}else if(action==='save-reply'){const c=getCase(id);state.replies[id]={text:$('reply-text').value,saved:true};log(id,'Сохранён черновик ответа клиенту.');$('draft-status').textContent='Черновик сохранён в этом браузере. Отправка клиенту в прототипе не подключена.';toast('Черновик сохранён в демо.')}else if(action==='copy-reply')await copyReply();else if(action==='route')routeCase(id);else if(action==='pause-card')pauseCard(id);else if(action==='download'){const p=getPayment(id),blob=new Blob([documentText(p)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='DEMO-'+p.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Скачан текстовый демо-образец документа.')}else if(action==='confirm-reset'){state=freshState();save();['secondary','detail','compose'].forEach(x=>{if($(x).open)$(x).close()});Object.assign(ui,{scope:'anna',caseFilter:'open',paymentFilter:'attention',cardFilter:'all',scenarioFilter:'all',clientScope:'all',currentCase:null});setView('work');toast('Исходные 14 сценариев восстановлены.')}});
    document.addEventListener('change',e=>{const t=e.target;if(t.id==='owner-scope'){ui.scope=t.value;render()}else if(t.dataset.checkCase){const id=t.dataset.checkCase,index=Number(t.dataset.checkIndex);(state.checks[id]??=[])[index]=t.checked;save();$('check-progress').textContent=state.checks[id].filter(Boolean).length+' / '+getCase(id).steps.length}else if(t.dataset.caseOwner){const c=getCase(t.dataset.caseOwner);c.owner=t.value;log(c.id,'Ответственный за обращение: '+owner(c.owner).name+'.');render();updateCasePanel()}else if(t.dataset.caseStatus){const c=getCase(t.dataset.caseStatus);c.status=t.value;log(c.id,'Статус обращения: '+STATUS[c.status]+'.');render();updateCasePanel()}else if(t.dataset.caseDue&&/^\d{2}:\d{2}$/.test(t.value)){const c=getCase(t.dataset.caseDue);c.due='2026-09-24T'+t.value+':00+02:00';log(c.id,'Следующий ответ клиенту: '+t.value+'.');render();$('detail-deadline').innerHTML=deadline(c)}});
    document.addEventListener('input',e=>{const t=e.target;if(t.dataset.replyCase){state.replies[t.dataset.replyCase]={text:t.value,saved:false};$('draft-status').textContent=I18N.text('Есть изменения. Сохраните черновик, чтобы оставить его в этом браузере.')}});
    document.addEventListener('submit',e=>{
      if(e.target.id!=='new-case-form')return;e.preventDefault();if(!e.target.reportValidity())return;
      const f=new FormData(e.target),id='AM-'+(2401+state.cases.length),cl=String(f.get('client'));
      state.cases.push({id,client:cl,category:String(f.get('category')),priority:String(f.get('priority')),title:String(f.get('title')).trim(),message:String(f.get('message')).trim(),owner:'anna',status:'new',channel:'Демо-запрос',created:'2026-09-24T11:30:00+02:00',due:'2026-09-24T13:30:00+02:00',next:'Уточнить запрос и найти связанную операцию',steps:['Понять ожидаемый результат клиента.','Найти связанную операцию и проверить подтверждающие данные.','Определить следующий шаг и подготовить ответ.'],reply:L(client(cl).contact.split(' ')[0]+', добрый день! Получила ваш запрос. Уточню детали по вашему профилю и сообщу следующий шаг до 13:30.',I18N.text(client(cl).contact).split(' ')[0]+', hello! I have received your request. I will check your profile and confirm the next step by 13:30.'),success:'Для собственного сценария видны клиент, ответственный, срок и следующий шаг.',routes:['/clients']});
      save();$('compose').close();ui.scope='anna';ui.caseFilter='open';setView('work');openCase(id);toast('Новое обращение добавлено в демо-очередь.');
    });
    let previousView='work';$('global-search').addEventListener('input',e=>{ui.query=e.target.value;if(ui.query.trim()){if(ui.view!=='search')previousView=ui.view;ui.view='search'}else ui.view=previousView;render()});
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&!document.querySelector('dialog[open]')){e.preventDefault();$('global-search').focus()}if(e.key==='Escape')closeMobile()});
    $('menu-toggle').addEventListener('click',()=>{const open=!$('sidebar').classList.contains('mobile-open');$('sidebar').classList.toggle('mobile-open',open);$('mobile-scrim').classList.toggle('show',open);$('menu-toggle').setAttribute('aria-expanded',String(open));syncMobileNav()});$('mobile-scrim').addEventListener('click',closeMobile);matchMedia('(max-width:740px)').addEventListener('change',syncMobileNav);syncMobileNav();
    $('reset-demo').addEventListener('click',()=>secondary('Начать демо заново?',`<p class="small muted" style="line-height:1.8">${L('Будут восстановлены исходные обращения, карты и примеры онбординга. Локальные черновики, свои обращения и изменения форм, уровней и правил будут очищены. Выбранный язык сохранится.','The initial cases, cards and onboarding examples will be restored. Local drafts, custom cases and changes to forms, levels and rules will be cleared. Your selected language will be kept.')}</p>`,`<button class="button" data-close="secondary">Отмена</button><button class="button primary" data-action="confirm-reset">Восстановить сценарии</button>`));
    document.addEventListener('click',event=>{const control=event.target.closest('[data-language]');if(!control||document.querySelector('dialog[open]'))return;I18N.set(control.dataset.language);render()});
    function localizeLiveCaseLabels(){['draft-status','detail-deadline','case-history'].forEach(id=>{if($(id))I18N.apply($(id))})}
    document.addEventListener('change',localizeLiveCaseLabels);
    document.addEventListener('click',localizeLiveCaseLabels);
    $('compose').addEventListener('toggle',()=>{if($('compose').open)I18N.apply($('compose'))});
    $('search-icon').innerHTML=icon('search');$('reset-demo').innerHTML=icon('reset');$('menu-toggle').innerHTML=icon('menu');registerDemoTranslations();render();
  </script>
